# LeeWay R23 exemption: YAML workflows cannot carry HTML comment headers.
# Governance metadata for this file lives in governance/LEEWAY-STANDARDS-ALIGNMENT.md.
name: LeeWay Global P2P — GitHub Pages

on:
  workflow_run:
    workflows: ['LeeWay Global P2P — verify and signed Android release']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build universal Web/PWA app
        run: |
          npm ci
          npm run build

      - name: Download signed APK artifact when available
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: leeway-global-p2p-signed-apk
          path: downloaded-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble Pages site
        run: |
          mkdir -p pages-dist/app pages-dist/downloads
          cp -r site/. pages-dist/
          cp -r dist/. pages-dist/app/
          cp docs/VERIFICATION.md pages-dist/app/VERIFICATION.md
          if compgen -G "downloaded-apk/*.apk" > /dev/null; then
            cp downloaded-apk/*.apk pages-dist/downloads/
            cp downloaded-apk/SHA256SUMS.txt pages-dist/downloads/
          elif compgen -G "release/*.apk" > /dev/null; then
            # The reviewed signed APK is committed; publish it when CI has no signing secrets.
            cp release/*.apk pages-dist/downloads/
            cp release/SHA256SUMS.txt pages-dist/downloads/
          fi
          test -s pages-dist/downloads/SHA256SUMS.txt
          test -n "$(compgen -G 'pages-dist/downloads/*.apk' || true)"
          QR_OUT=pages-dist/leeway-qr.png node scripts/generate-qr.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      # GitHub upload finalized the artifact, but Pages metadata was not yet queryable.
      # Poll this run's artifact index for at most 90 seconds. Never report a fake PASS.
      - name: Wait for GitHub Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for attempt in $(seq 1 30); do
            count=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              found=1
              break
            fi
            if [ "$count" != "0" ]; then
              echo "Unexpected GitHub Pages artifact count: $count" >&2
              exit 1
            fi
            sleep 3
          done
          if [ "$found" != "1" ]; then
            echo 'Timed out waiting for the GitHub Pages artifact metadata.' >&2
            exit 1
          fi
          echo 'GitHub Pages artifact metadata is queryable.'
          sleep 5

      - id: deployment
        uses: actions/deploy-pages@v4
