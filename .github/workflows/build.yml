name: LeeWay Global P2P — verify and signed Android release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  LEEWAY_KEYSTORE_BASE64: ${{ secrets.LEEWAY_KEYSTORE_BASE64 }}

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          npm config set allow-scripts true
          npm ci

      - name: Web, crypto, dispatch and relay verification
        run: npm run verify

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version name from tag or build.gradle
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF_NAME#v}"
          else
            APP_VERSION=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | head -1 | sed 's/versionName "//;s/"//')
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved version: $APP_VERSION"

      - name: Prepare Android SDK and signing key
        if: env.LEEWAY_KEYSTORE_BASE64 != ''
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "$LEEWAY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/leeway-release.jks"

      - name: Build signed release APK
        if: env.LEEWAY_KEYSTORE_BASE64 != ''
        env:
          LEEWAY_KEYSTORE_FILE: ${{ runner.temp }}/leeway-release.jks
          LEEWAY_STORE_PASSWORD: ${{ secrets.LEEWAY_STORE_PASSWORD }}
          LEEWAY_KEY_ALIAS: ${{ secrets.LEEWAY_KEY_ALIAS }}
          LEEWAY_KEY_PASSWORD: ${{ secrets.LEEWAY_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease --no-daemon && cd ..
          mkdir -p release
          APK="release/leeway-global-p2p-${APP_VERSION}-release.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > release/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload signed APK artifact
        if: env.LEEWAY_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: leeway-global-p2p-signed-apk
          path: |
            release/*.apk
            release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release on version tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.LEEWAY_KEYSTORE_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          generate_release_notes: true
